services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD tanımlanmalı}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dashboard:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SwaggerDashboard: >-
        Server=db,1433;Database=SwaggerDashboard;User Id=sa;
        Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True

      # Nothing is reachable until the target domains are listed here. The prefixed URL
      # model lets any authorised user name a host, so this list is the control that keeps
      # the platform from acting as an open proxy.
      SwaggerDashboard__Outbound__AllowedHostSuffixes__0: ${ALLOWED_HOST_SUFFIX:?Hedef API alan adı tanımlanmalı}

      # The first administrator. Change the password after the first sign in; if this is
      # left unset a random password is generated and written once to the container log.
      SwaggerDashboard__Seed__AdminUserName: ${ADMIN_USERNAME:-admin}
      SwaggerDashboard__Seed__AdminPassword: ${ADMIN_PASSWORD:-}
    restart: unless-stopped

volumes:
  mssql-data:
